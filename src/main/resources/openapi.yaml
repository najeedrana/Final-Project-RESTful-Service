openapi: 3.0.3
info:
  title: Student REST API
  version: 1.0.0
  description: Basic database-backed REST API for managing student records.
servers:
  - url: http://localhost:8080/api
paths:
  /students:
    get:
      summary: List students
      responses:
        '200':
          description: Student collection with HATEOAS navigation links
          headers:
            Cache-Control:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  students:
                    type: array
                    items: { $ref: '#/components/schemas/Student' }
                  _links: { type: object }
    post:
      summary: Create a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '201': { description: Student created; Location header identifies the resource }
        '400': { description: Invalid request }
  /students/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      summary: Get one student (supports ETag / If-None-Match)
      responses:
        '200':
          description: Student resource
          headers:
            ETag: { schema: { type: string } }
            Cache-Control: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '304': { description: Not modified }
        '404': { description: Student not found }
    put:
      summary: Replace a student
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '200': { description: Student updated }
        '400': { description: Invalid request }
        '404': { description: Student not found }
    delete:
      summary: Delete a student
      responses:
        '204': { description: Student deleted }
        '404': { description: Student not found }
components:
  schemas:
    StudentInput:
      type: object
      required: [name, email, course]
      properties:
        name: { type: string, example: Alex Morgan }
        email: { type: string, format: email, example: alex@example.com }
        course: { type: string, example: Software Engineering }
    Student:
      allOf:
        - $ref: '#/components/schemas/StudentInput'
        - type: object
          properties:
            id: { type: integer, format: int64 }
            _links: { type: object, description: Hypermedia links for self, update and delete actions }
